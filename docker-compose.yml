version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news_network

  # FastAPI Backend
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://news_user:news_password@db:5432/news_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./etl:/app/etl
    networks:
      - news_network
    restart: unless-stopped

  # ETL Job (runs periodically)
  # Uncomment the command to run ETL on container start
  # For scheduled runs, use cron or external scheduler
  etl:
    build: .
    environment:
      DATABASE_URL: postgresql://news_user:news_password@db:5432/news_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./etl:/app/etl
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    networks:
      - news_network
    # Run ETL once and exit
    command: python scripts/run_etl.py
    restart: "no"

volumes:
  pgdata:

networks:
  news_network:
    driver: bridge
