<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Feeds - Divij's Digest</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/feeds.css">
</head>
<body>
    <div class="feeds-page">
        <header class="feeds-header">
            <h1>⚙️ Manage RSS Feeds</h1>
            <a href="/" class="refresh-btn">← Back to Digest</a>
        </header>

        <section class="feeds-form-card">
            <h2>Add Feed</h2>
            <form id="add-feed-form" class="feeds-form">
                <input type="text" id="new-category" placeholder="Category (e.g. technology)" required>
                <input type="url" id="new-url" placeholder="https://example.com/rss" required>
                <button type="submit" class="refresh-btn">Add Feed</button>
            </form>
            <p id="add-feed-error" class="feeds-error"></p>
        </section>

        <section class="feeds-list-card">
            <h2>Current Feeds</h2>
            <div id="feeds-table-container">
                <div class="loading">Loading feeds...</div>
            </div>
        </section>
    </div>

    <script src="/static/feeds.js"></script>
</body>
</html>
