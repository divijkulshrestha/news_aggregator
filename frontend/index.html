<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal News Aggregator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📰 News</h1>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Categories</h3>
                <nav class="category-nav">
                    <button class="category-btn active" data-category="top_stories">
                        <span class="category-icon">🔥</span>
                        <span>Top Stories</span>
                    </button>
                    <button class="category-btn" data-category="india">
                        <span class="category-icon">📍</span>
                        <span>India</span>
                    </button>
                    <button class="category-btn" data-category="world">
                        <span class="category-icon">🌍</span>
                        <span>World</span>
                    </button>
                    <button class="category-btn" data-category="business_finance">
                        <span class="category-icon">💼</span>
                        <span>Business and Finance</span>
                    </button>
                    <button class="category-btn" data-category="science_history">
                        <span class="category-icon">🔬</span>
                        <span>Science and History</span>
                    </button>
                    <button class="category-btn" data-category="technology">
                        <span class="category-icon">💻</span>
                        <span>Technology</span>
                    </button>
                    <button class="category-btn" data-category="company_blogs">
                        <span class="category-icon">✍️</span>
                        <span>Company Blogs</span>
                    </button>
                    <button class="category-btn" data-category="cricket">
                        <span class="category-icon">🏏</span>
                        <span>Cricket</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Appearance</h3>
                <div class="theme-switcher">
                    <button class="theme-btn active" data-theme="light">
                        <span>☀️ Light</span>
                    </button>
                    <button class="theme-btn" data-theme="dark">
                        <span>🌙 Dark</span>
                    </button>
                    <button class="theme-btn" data-theme="sepia">
                        <span>📜 Sepia</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="🔍 Search headlines..."
                    >
                </div>

                <div class="time-filters">
                    <button class="filter-btn time-btn" data-time="1h">Last Hour</button>
                    <button class="filter-btn time-btn active" data-time="1d">Last Day</button>
                    <button class="filter-btn time-btn" data-time="7d">Last Week</button>
                </div>

                <button class="refresh-btn" onclick="refreshArticles()">🔄 Refresh</button>
            </header>

            <div class="stats">
                <span id="article-count">Loading...</span>
                <span id="last-update"></span>
            </div>

            <div id="articles-container" class="articles-grid">
                <div class="loading">Loading articles...</div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
